services:
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${AUTH_HTTP_PORT}:${AUTH_HTTP_PORT}"
    environment:
      APP_NAME: auth-service
      APP_VERSION: ${AUTH_APP_VERSION}
      HTTP_PORT: ${AUTH_HTTP_PORT}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: pg
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DBNAME: ${POSTGRES_DB}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE}
      REDIS_ADDR: redis:${REDIS_PORT}
      REDIS_HOST: ""
      REDIS_PORT: ""
      ANALYTICS_ADDR: ${ANALYTICS_ADDR}
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      analytics-service:
        condition: service_started
    networks:
      - shortlink

  shortlink-service:
    build:
      context: ./shortlink-service
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${SHORTLINK_HTTP_PORT}:${SHORTLINK_HTTP_PORT}"
    environment:
      APP_NAME: shortlink-service
      APP_VERSION: ${SHORTLINK_APP_VERSION}
      HTTP_PORT: ${SHORTLINK_HTTP_PORT}
      SECRET_JWT_SECRET: ${JWT_SECRET}
      PG_HOST: pg
      PG_PORT: ${POSTGRES_PORT}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DBNAME: ${POSTGRES_DB}
      PG_SSLMODE: ${POSTGRES_SSLMODE}
      REDIS_ADDR: redis:${REDIS_PORT}
      ANALYTICS_ADDR: ${ANALYTICS_ADDR}
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      analytics-service:
        condition: service_started
    networks:
      - shortlink

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${ANALYTICS_GRPC_PORT}:${ANALYTICS_GRPC_PORT}"
      - "${ANALYTICS_HTTP_PORT}:${ANALYTICS_HTTP_PORT}"
    environment:
      APP_NAME: analytics-service
      APP_VERSION: ${ANALYTICS_APP_VERSION}
      HTTP_PORT: ${ANALYTICS_HTTP_PORT}
      GRPC_PORT: ${ANALYTICS_GRPC_PORT}
      SECRET_JWT_SECRET: ${JWT_SECRET}
      PG_HOST: pg
      PG_PORT: ${POSTGRES_PORT}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DBNAME: ${POSTGRES_DB}
      PG_SSLMODE: ${POSTGRES_SSLMODE}
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - shortlink

  pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shortlink

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shortlink

volumes:
  pg_data:
  redis_data:

networks:
  shortlink:
    driver: bridge
